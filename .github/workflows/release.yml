name: Release PixelForge Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Package Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/pixelforge.exe dist/PixelForge.exe
          Compress-Archive -Path dist/PixelForge.exe -DestinationPath dist/PixelForge-v0.5.0-windows-x64.zip -Force
      - name: Publish GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.5.0"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/PixelForge-v0.5.0-windows-x64.zip --clobber
          } else {
            gh release create $tag dist/PixelForge-v0.5.0-windows-x64.zip --target "${{ github.sha }}" --title "PixelForge v0.5.0 - Public Test" --prerelease --notes @"
          PixelForge v0.5.0 is a Windows x64 public testing build.

          Highlights:
          - Photo adjustment controls and before/after comparison viewer
          - Selection brush, saved selection library, and undo/redo
          - Independent global and selection-based adjustments
          - PXF8 project saving with active selection masks and adjustments
          - Local AI tools (availability depends on installed models and configuration)

          Download the ZIP, extract it, and run PixelForge.exe. Windows SmartScreen may prompt because this early build is not code-signed.

          Please report bugs and feedback in GitHub Issues.
          "@
          }
