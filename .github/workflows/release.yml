name: Release PixelForge Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne '${{ github.ref_name }}') { throw 'Tag and package version differ' }
      - name: Run tests
        run: cargo test --locked
      - name: Build release
        run: cargo build --locked --release
      - name: Package Windows release
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $folder = "dist/PixelForge-$tag-windows-x64"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item target/release/pixelforge.exe "$folder/PixelForge.exe"
          Copy-Item README.md $folder
          Copy-Item docs "$folder/docs" -Recurse
          $archive = "dist/PixelForge-$tag-windows-x64.zip"
          Compress-Archive -Path "$folder/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  PixelForge-$tag-windows-x64.zip" | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          New-Item -ItemType Directory -Path $compilerRoot -Force | Out-Null
          $setup = Join-Path $compilerRoot 'innosetup-6.7.4.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup
          if ((Get-AuthenticodeSignature $setup).Status -ne 'Valid') { throw 'Compiler signature did not validate' }
          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /NOICONS /TASKS="" /DIR="' + $compilerRoot + '"'
          $process = Start-Process $setup -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed' }
          $tag = '${{ github.ref_name }}'
          & ./scripts/Build-Installer.ps1 -Compiler "$compilerRoot/ISCC.exe" -SourceDir "$PWD/dist/PixelForge-$tag-windows-x64" -OutputDir "$PWD/dist"
          $installer = "PixelForge-$tag-windows-x64-setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$installer").Hash.ToLowerInvariant()
          "$hash  $installer" | Add-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag "dist/PixelForge-$tag-windows-x64.zip" "dist/PixelForge-$tag-windows-x64-setup.exe" dist/SHA256SUMS.txt --verify-tag --title "PixelForge $tag" --notes-file "docs/RELEASE_NOTES_$tag.md" --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
