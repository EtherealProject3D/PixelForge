name: Release PixelForge Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne '${{ github.ref_name }}') { throw 'Tag and package version differ' }
      - name: Run tests
        run: cargo test --locked
      - name: Build release
        run: cargo build --locked --release
      - name: Package Windows release
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $folder = "dist/PixelForge-$tag-windows-x64"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item target/release/pixelforge.exe "$folder/PixelForge.exe"
          Copy-Item README.md $folder
          Copy-Item docs "$folder/docs" -Recurse
          $archive = "dist/PixelForge-$tag-windows-x64.zip"
          Compress-Archive -Path "$folder/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  PixelForge-$tag-windows-x64.zip" | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag "dist/PixelForge-$tag-windows-x64.zip" dist/SHA256SUMS.txt --verify-tag --title "PixelForge $tag" --notes-file "docs/RELEASE_NOTES_$tag.md" --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }