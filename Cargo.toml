[package]
name = "pixelforge"
version = "0.6.5"
edition = "2024"

[dependencies]
eframe = { version = "0.32", features = ["persistence"] }
egui = "0.32"
raw-window-handle = "0.6"
arboard = { version = "3.7", default-features = false }
image = "0.25"
rfd = "0.15"
ash = "0.38"
serde_json = "1"
serde_yaml = "0.9"
fs2 = "0.4"
ring = "0.17"
tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Globalization", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Security_Cryptography", "Win32_Security_WinTrust"] }
