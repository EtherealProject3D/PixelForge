[package]
name = "pixelforge"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.32"
egui = "0.32"
image = "0.25"
rfd = "0.15"
ash = "0.38"
serde_json = "1"
serde_yaml = "0.9"
fs2 = "0.4"
tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Globalization", "Win32_System_Com"] }
